server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: sentiment-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:sentiment_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

gozero:
  services:
    ingestion-url: ${INGESTION_BASE_URL:http://localhost:8081}
  sentiment:
    lexicon-path: lexicon/sentiment-lexicon.txt
