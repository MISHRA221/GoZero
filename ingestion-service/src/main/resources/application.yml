server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ingestion-service
  datasource:
    # Default: embedded H2 in PostgreSQL mode (no install needed). Docker/K8s override with a PostgreSQL URL.
    url: ${DB_URL:jdbc:h2:mem:ingestion_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

gozero:
  scraper:
    enabled: ${SCRAPER_ENABLED:true}
    base-url: https://www.bigbasket.com
    brand-path: /pb/go-zero/
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
    delay-ms: ${SCRAPER_DELAY_MS:1500}
    max-products: ${SCRAPER_MAX_PRODUCTS:25}
    timeout-ms: ${SCRAPER_TIMEOUT_MS:10000}
    min-live-products: 3
