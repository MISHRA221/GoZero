# PostgreSQL: one server (StatefulSet + PVC), one database + one login per service (database-per-service).
# Demo credentials only - in a real cluster these come from an external secret store (Vault / Sealed Secrets / ESO).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: go-zero
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres_demo_pw
  INGESTION_DB_PASSWORD: ingestion_demo_pw
  SENTIMENT_DB_PASSWORD: sentiment_demo_pw
  RECONCILIATION_DB_PASSWORD: reconciliation_demo_pw
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: go-zero
data:
  init-databases.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<-EOSQL
        CREATE USER ingestion_user WITH PASSWORD '${INGESTION_DB_PASSWORD}';
        CREATE DATABASE ingestion_db OWNER ingestion_user;
        CREATE USER sentiment_user WITH PASSWORD '${SENTIMENT_DB_PASSWORD}';
        CREATE DATABASE sentiment_db OWNER sentiment_user;
        CREATE USER reconciliation_user WITH PASSWORD '${RECONCILIATION_DB_PASSWORD}';
        CREATE DATABASE reconciliation_db OWNER reconciliation_user;
        REVOKE CONNECT ON DATABASE ingestion_db FROM PUBLIC;
        REVOKE CONNECT ON DATABASE sentiment_db FROM PUBLIC;
        REVOKE CONNECT ON DATABASE reconciliation_db FROM PUBLIC;
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: go-zero
  labels:
    app: postgres
spec:
  clusterIP: None   # headless: stable DNS for the StatefulSet pod
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: go-zero
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata   # subdir avoids lost+found on fresh volumes
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
