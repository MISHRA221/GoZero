apiVersion: v1
kind: ConfigMap
metadata:
  name: sentiment-config
  namespace: go-zero
data:
  SERVER_PORT: "8082"
  DB_URL: jdbc:postgresql://postgres:5432/sentiment_db
  H2_CONSOLE_ENABLED: "false"
  INGESTION_BASE_URL: http://ingestion-service:8081
  JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC"
---
apiVersion: v1
kind: Secret
metadata:
  name: sentiment-db-secret
  namespace: go-zero
type: Opaque
stringData:
  DB_USERNAME: sentiment_user
  DB_PASSWORD: sentiment_demo_pw   # must match SENTIMENT_DB_PASSWORD in postgres-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-service
  namespace: go-zero
  labels:
    app: sentiment-service
    app.kubernetes.io/part-of: gozero-brand-intelligence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentiment-service
  template:
    metadata:
      labels:
        app: sentiment-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
      containers:
        - name: sentiment-service
          image: gozero/sentiment-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: sentiment-config
            - secretRef:
                name: sentiment-db-secret
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: sentiment-service
  namespace: go-zero
  labels:
    app: sentiment-service
spec:
  type: ClusterIP
  selector:
    app: sentiment-service
  ports:
    - name: http
      port: 8082
      targetPort: http
